<h1>Login!</h1>

<div class="container">
  <div>
    <!-- *ngIf is a angular directive. it display the error msg only if the value is true. -->
    <div *ngIf="invalidCred" class="alert alert-warning">{{errorMsg}}</div>
  </div>

  <div>
    UserName : <input type="text" name="user" [(ngModel)]="username" />
    <!-- {{username}} is a one way data binding interpolation member variable of login.component.ts-->
    Password : <input type="password" name="paswd" [(ngModel)]="password" />
    <!-- [(ngModel)] is two way data binding-->

    <!-- button event syntac => <button (event)=function()>Login</button> 
handleLogin() function should be defined in login.component.ts--->
    <!-- <button (click)="handleLogin()" class="btn btn-success">login</button> -->
    <button (click)="basicAuthentication()" class="btn btn-success">login</button>
    <!--In the above input element value={{username}} bind the value only one side either from component, or from html to component. 
to resolve the problem we should use ngModel="username" it can bind the value to the variable for both side. we can pass the vlaue from html and from component
also -->

    <!-- To use ngModel we should import the ngModel in app.mdule , becoz ngModel is class type.-->
  </div>

</div>
