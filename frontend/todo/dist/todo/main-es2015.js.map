<div class="container">
    <div style="padding: 3px;"></div>

    <h1 class="h1text">My Todo's</h1>
    <div class="top-head">
        <!-- *ngIf is a angular directive. it display the error msg only if the value is true. -->
        <div *ngIf="deleteMessage" class="alert alert-success">{{deleteMessage}}</div>
       <span >
            <button (click)="addTodo()" class="btn btn-info bewbtn">New Todo</button>
        </span>
    </div>

    <table class="table">

        <!--table is a inbuilt class name for standard style-->
        <thead>
            <tr>

                <th>Description</th>
                <th>is Completed?</th>
                <th>Target Date</th>
                <th>Delete</th>
                <th>Update</th>
            </tr>
        </thead>
        <tbody>
            <!--we can retrive the todo object vale using interpolation like below for single data
        <tr>
            <td>{{todo.id}} </td>
            <td>{{todo.description}}</td>
        </tr>
    -->
            <!--if you want iterate more values from object we can got to ngFor loop like for loop in java-->
            <!-- *ngFor is equal to for(int num : arr) here " and ": equal to of "-->
            <tr *ngFor=" let todo of todos">
                <td>{{todo.description}} </td>
                <td>{{todo.done}}</td>
                <td>{{todo.targetDate | date | uppercase}}</td>
                <!-- | operator is called as pipe optr. used to convert data one format into another format-->
                <td><button (click)="deleteTodo(todo.id)" class="btn btn-danger">Delete</button></td>
                <td><button (click)="updateTodo(todo.id)" class="btn btn-success">Update</button></td>
            </tr>
        </tbody>
    </table>

</div>
