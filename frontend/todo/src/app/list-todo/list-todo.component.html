<h1>My Todo's</h1>
<div class="container">
    <table class="table">
        <!--table is a inbuilt class name for standard style-->
        <thead>
            <tr>

                <th>Description</th>
                <th>is Completed?</th>
                <th>Target Date</th>
            </tr>
        </thead>
        <tbody>
            <!--we can retrive the todo object vale using interpolation like below for single data
        <tr>
            <td>{{todo.id}} </td>
            <td>{{todo.description}}</td>
        </tr>
    -->
            <!--if you want iterate more values from object we can got to ngFor loop like for loop in java-->
            <!-- *ngFor is equal to for(int num : arr) here " and ": equal to of "-->
            <tr *ngFor=" let todo of todos">
                <td>{{todo.description}} </td>
                <td>{{todo.done}}</td>
                <td>{{todo.targetDate | date | uppercase}}</td>
                <!-- | operator is called as pipe optr. used to convert data one format into another format-->
            </tr>
        </tbody>
    </table>
</div>
